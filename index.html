  display: block;
  margin-top: 5px;
  border-radius: 5px;

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref('messages');

let currentUser = null;
let peer;

// --- SISTEMA DE LOGIN ---
function login() {
    let username = document.getElementById("username").value;
    if (!username) return alert("Digite um nome!");

    currentUser = username;
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("currentUser").innerText = "Logado como: " + username;

    initPeer(username);
    listenToMessages(); // Começa a ouvir o banco de dados
}

// --- SISTEMA DE MENSAGENS REALTIME ---
function sendMessage() {
    let text = document.getElementById("messageInput").value;
    if (!text) return;

    // Salva no Firebase (isso avisa todos os outros usuários na hora)
    messagesRef.push({
        user: currentUser,
        text: text,
        timestamp: Date.now()
    });

    document.getElementById("messageInput").value = "";
}

function listenToMessages() {
    // Esta função "escuta" qualquer mudança no banco e atualiza a tela
    messagesRef.on('value', (snapshot) => {
        const data = snapshot.val();
        renderMessages(data);
    });
}

function renderMessages(data) {
    let chat = document.getElementById("chat");
    chat.innerHTML = "";
    if (!data) return;

    Object.values(data).forEach(msg => {
        let div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `<strong>${msg.user}:</strong> ${msg.text}`;
        chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
}

// --- SISTEMA DE VOZ (PEERJS) ---
function initPeer(id) {
    peer = new Peer(id); 

    peer.on('call', (call) => {
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
            call.answer(stream);
            call.on('stream', (remoteStream) => playRemoteStream(remoteStream));
        });
    });
}

async function startVoice() {
    const target = prompt("Com quem você quer falar? (Digite o nome de usuário)");
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const call = peer.call(target, stream);
    call.on('stream', (remoteStream) => playRemoteStream(remoteStream));
}

function playRemoteStream(stream) {
    const audio = new Audio();
    audio.srcObject = stream;
    audio.play();
}
